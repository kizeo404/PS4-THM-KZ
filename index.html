<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d1117">
    <meta name="description" content="Biblioteca de temas PS4 con previews y descargas - KiZeo">
    <title>PS4 THM KZ</title>
    <link rel="icon" href="recursos/favicon.png" type="image/png">
    <style>
        @font-face {
            font-family: 'Dancing Script';
            font-style: normal;
            font-weight: 600;
            font-display: swap;
            src: url('recursos/dancing-script-600.woff2') format('woff2');
        }

        :root {
            --bg: #0d1117;
            --card: #161b22;
            --blue: #0072ce;
            --text: #e6edf3;
            --border: #30363d;
            --accent: #58a6ff;
            --muted: #8b949e;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            padding-bottom: 50px;
        }

        button:focus-visible,
        a:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        header {
            background: rgba(13, 17, 23, 0.98);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 2px solid var(--blue);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .main-logo {
            max-width: 100%;
            width: 600px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .subtitle {
            font-family: 'Dancing Script', cursive;
            font-size: 1.5rem;
            color: var(--accent);
            margin: 10px 0 20px 0;
        }

        .social-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .social-icon {
            width: 32px;
            height: 32px;
            transition: transform 0.3s ease;
        }

        .social-icon:hover { transform: scale(1.2); }

        .controls-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
        }

        .search-box {
            width: 100%;
            max-width: 500px;
            padding: 12px 25px;
            border-radius: 30px;
            border: 1px solid var(--border);
            background: #010409;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .search-box:focus { border-color: var(--blue); }

        .sort-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-tool {
            background: #21262d;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
        }

        .btn-tool:hover,
        .btn-tool.active {
            background: var(--blue);
            border-color: var(--blue);
            color: #fff;
        }

        .count {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
        }

        main {
            padding: 40px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            color: inherit;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--blue);
        }

        .preview-btn {
            position: relative;
            display: block;
            width: 100%;
            padding: 0;
            border: 0;
            background: #000;
            cursor: zoom-in;
            aspect-ratio: 16 / 9;
            overflow: hidden;
        }

        .preview-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.35s ease, opacity 0.35s ease;
        }

        .preview-btn:hover img {
            transform: scale(1.04);
            opacity: 0.85;
        }

        .preview-btn::after {
            content: "Ver preview";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
        }

        .preview-btn:hover::after,
        .preview-btn:focus-visible::after {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .card-info {
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .card-info h3 {
            margin: 0;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
            height: 40px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .btn-download {
            display: inline-block;
            margin-top: auto;
            padding: 8px 16px;
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--blue);
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-download:hover {
            background: var(--blue);
            color: #fff;
        }

        .card-info .btn-download { align-self: center; }

        .btn-container { text-align: center; margin-top: 40px; }

        .btn-load {
            padding: 14px 40px;
            background: transparent;
            color: var(--blue);
            border: 2px solid var(--blue);
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: 0.3s;
        }

        .btn-load:hover { background: var(--blue); color: #fff; }

        .hidden { display: none !important; }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--muted);
        }

        #debug-console {
            background: #2a1010;
            color: #ff7b72;
            padding: 10px;
            font-size: 12px;
            text-align: center;
            display: none;
        }

        /* MODAL PREVIEW */
        #preview-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            padding: 20px;
        }

        #preview-modal.open { display: flex; }

        .modal-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 95vw;
            max-height: 92vh;
        }

        #modal-img {
            max-width: 90vw;
            max-height: calc(92vh - 90px);
            border: 3px solid var(--blue);
            border-radius: 8px;
            object-fit: contain;
        }

        .modal-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 12px;
            text-align: center;
        }

        #modal-title {
            margin: 0;
            font-size: 15px;
            font-weight: 500;
        }

        #modal-download { margin-top: 0; }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 50px;
            cursor: pointer;
            line-height: 1;
            z-index: 2;
        }

        .close-modal:hover { color: var(--accent); }

        body.modal-open { overflow: hidden; }

        @media (max-width: 640px) {
            header {
                position: static;
                padding: 20px 12px;
            }

            .main-logo { width: 100%; }

            .subtitle {
                font-size: 1.2rem;
                margin: 8px 0 15px;
            }

            .social-container {
                gap: 16px;
                margin-bottom: 18px;
            }

            .social-icon {
                width: 28px;
                height: 28px;
            }

            main {
                padding: 25px 12px;
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 18px;
            }

            #modal-img { max-width: 92vw; max-height: calc(88vh - 100px); }

            .close-modal {
                top: 8px;
                right: 16px;
                font-size: 40px;
            }

            .modal-bar {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>
<body>

<div id="debug-console"></div>

<header>
    <img src="recursos/titulo.png" alt="PS4 Themes" class="main-logo">
    <p class="subtitle">Creado por KiZeo</p>

    <div class="social-container">
        <a href="https://www.youtube.com/@kizeo0/videos" target="_blank" rel="noopener" title="YouTube">
            <img src="recursos/yt.png" alt="YouTube" class="social-icon">
        </a>
        <a href="https://github.com/kizeo404" target="_blank" rel="noopener" title="GitHub">
            <img src="recursos/git.png" alt="GitHub" class="social-icon">
        </a>
        <a href="https://x.com/KiZeo0" target="_blank" rel="noopener" title="X">
            <img src="recursos/x.png" alt="X" class="social-icon">
        </a>
    </div>

    <div class="controls-wrapper">
        <input type="text" id="search" class="search-box" placeholder="Buscar temas...">
        <div class="sort-container">
            <button class="btn-tool active" data-sort="AZ" type="button">🔤 A - Z</button>
            <button class="btn-tool" data-sort="ZA" type="button">🔤 Z - A</button>
            <button class="btn-tool" data-sort="RANDOM" type="button">🎲 Azar</button>
        </div>
        <p id="count" class="count"></p>
    </div>
</header>

<div id="preview-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <span class="close-modal" id="closeModal" role="button" tabindex="0" aria-label="Cerrar">&times;</span>
    <div class="modal-content">
        <img id="modal-img" src="" alt="Vista previa">
        <div class="modal-bar">
            <h2 id="modal-title"></h2>
            <a id="modal-download" class="btn-download" href="#" target="_blank" rel="noopener">Descargar tema</a>
        </div>
    </div>
</div>

<main id="gallery"></main>

<div class="btn-container">
    <button id="loadMore" class="btn-load" type="button">Cargar más temas</button>
</div>

<script>
    let allThemes = [];
    let filteredThemes = [];
    let limit = 20;
    let sortMode = 'AZ';
    let lastFocused = null;

    const gallery = document.getElementById('gallery');
    const searchInput = document.getElementById('search');
    const loadMoreBtn = document.getElementById('loadMore');
    const countEl = document.getElementById('count');
    const debug = document.getElementById('debug-console');

    const modal = document.getElementById('preview-modal');
    const modalImg = document.getElementById('modal-img');
    const modalTitle = document.getElementById('modal-title');
    const modalDownload = document.getElementById('modal-download');
    const closeModalBtn = document.getElementById('closeModal');

    function encodePath(path) {
        return String(path).split('/').map(encodeURIComponent).join('/');
    }

    function updateCount() {
        countEl.textContent = filteredThemes.length === allThemes.length
            ? `${allThemes.length} temas disponibles`
            : `${filteredThemes.length} de ${allThemes.length} temas`;
    }

    function makeCard(tema) {
        const card = document.createElement('article');
        card.className = 'card';

        const previewBtn = document.createElement('button');
        previewBtn.type = 'button';
        previewBtn.className = 'preview-btn';
        previewBtn.setAttribute('aria-label', `Ver preview de ${tema.nombre}`);

        const img = document.createElement('img');
        img.loading = 'lazy';
        img.decoding = 'async';
        img.alt = tema.nombre;
        img.src = encodePath(tema.imagen);
        img.addEventListener('error', () => {
            // Si el WebP falla, intenta con el JPG completo.
            if (!img.dataset.fallback) {
                img.dataset.fallback = '1';
                img.src = encodePath(tema.full);
            } else {
                img.onerror = null;
                img.src = 'https://placehold.co/600x337/161b22/8b949e?text=Error';
            }
        });
        previewBtn.appendChild(img);
        previewBtn.addEventListener('click', () => openPreview(tema, previewBtn));

        const info = document.createElement('div');
        info.className = 'card-info';

        const title = document.createElement('h3');
        title.textContent = tema.nombre;

        const download = document.createElement('a');
        download.className = 'btn-download';
        download.href = tema.descarga;
        download.target = '_blank';
        download.rel = 'noopener';
        download.textContent = 'Descargar tema';

        info.append(title, download);
        card.append(previewBtn, info);
        return card;
    }

    function render() {
        gallery.innerHTML = '';
        const items = filteredThemes.slice(0, limit);

        if (items.length === 0) {
            const empty = document.createElement('p');
            empty.className = 'empty';
            empty.textContent = 'No se encontraron temas.';
            gallery.appendChild(empty);
            loadMoreBtn.classList.add('hidden');
            updateCount();
            return;
        }

        const frag = document.createDocumentFragment();
        items.forEach(tema => frag.appendChild(makeCard(tema)));
        gallery.appendChild(frag);

        loadMoreBtn.classList.toggle('hidden', limit >= filteredThemes.length);
        updateCount();
    }

    function applySort() {
        const collator = new Intl.Collator('es', { sensitivity: 'base' });

        if (sortMode === 'AZ') {
            filteredThemes.sort((a, b) => collator.compare(a.nombre, b.nombre));
        } else if (sortMode === 'ZA') {
            filteredThemes.sort((a, b) => collator.compare(b.nombre, a.nombre));
        } else if (sortMode === 'RANDOM') {
            for (let i = filteredThemes.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [filteredThemes[i], filteredThemes[j]] = [filteredThemes[j], filteredThemes[i]];
            }
        }
    }

    function applyFilter() {
        const text = searchInput.value.toLowerCase().trim();
        filteredThemes = text
            ? allThemes.filter(t => t.nombre.toLowerCase().includes(text))
            : [...allThemes];
        applySort();
        limit = 20;
        render();
    }

    function setSort(mode) {
        sortMode = mode;
        document.querySelectorAll('.btn-tool').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.sort === mode);
        });
        applySort();
        limit = 20;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openPreview(tema, trigger) {
        lastFocused = trigger || null;
        modalTitle.textContent = tema.nombre;
        modalDownload.href = tema.descarga;
        modalImg.alt = `${tema.nombre} - vista previa completa`;
        modalImg.src = encodePath(tema.full);
        modal.classList.add('open');
        document.body.classList.add('modal-open');
        closeModalBtn.focus();
    }

    function closePreview() {
        modal.classList.remove('open');
        document.body.classList.remove('modal-open');
        modalImg.removeAttribute('src');
        if (lastFocused) lastFocused.focus();
        lastFocused = null;
    }

    async function init() {
        try {
            const response = await fetch('./temas.json');
            if (!response.ok) {
                throw new Error(`Error ${response.status}: no se encontró temas.json.`);
            }

            const data = await response.json();
            if (!Array.isArray(data)) {
                throw new Error('temas.json no contiene una lista válida.');
            }

            allThemes = data;
            filteredThemes = [...allThemes];
            applySort();
            render();
        } catch (err) {
            debug.style.display = 'block';
            debug.textContent = 'ALERTA: ' + err.message;
            console.error(err);
        }
    }

    searchInput.addEventListener('input', applyFilter);

    document.querySelectorAll('.btn-tool').forEach(btn => {
        btn.addEventListener('click', () => setSort(btn.dataset.sort));
    });

    loadMoreBtn.addEventListener('click', () => {
        limit += 20;
        render();
    });

    closeModalBtn.addEventListener('click', closePreview);
    closeModalBtn.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            closePreview();
        }
    });

    modal.addEventListener('click', (e) => {
        if (e.target === modal) closePreview();
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.classList.contains('open')) closePreview();
    });

    init();
</script>
</body>
</html>
