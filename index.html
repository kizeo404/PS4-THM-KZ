<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d1117">
    <meta name="description" content="Biblioteca de temas PS4 con previews y descargas - KiZeo">
    <title>PS4 THM KZ</title>
    <link rel="icon" href="recursos/favicon.png" type="image/png">
    <style>
        @font-face {
            font-family: 'Dancing Script';
            font-style: normal;
            font-weight: 600;
            font-display: swap;
            src: url('recursos/dancing-script-600.woff2') format('woff2');
        }

        :root {
            --bg: #0d1117;
            --card: #161b22;
            --blue: #0072ce;
            --text: #e6edf3;
            --border: #30363d;
            --accent: #58a6ff;
            --muted: #8b949e;
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            padding-bottom: 70px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        button:focus-visible,
        a:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* ---------- Fondo animado ---------- */
        .bg-scene {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 50% -10%, rgba(0, 114, 206, 0.20), transparent 55%),
                radial-gradient(ellipse at 88% 18%, rgba(110, 64, 201, 0.14), transparent 50%),
                #0d1117;
        }

        .bg-scene::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 42%, transparent 42%, rgba(4, 7, 11, 0.55) 100%);
        }

        .bg-aurora {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.30;
            will-change: transform;
        }

        .bg-aurora-1 {
            width: 55vw;
            height: 55vw;
            left: -14vw;
            top: -20vw;
            background: #0072ce;
            animation: aurora-1 26s ease-in-out infinite alternate;
        }

        .bg-aurora-2 {
            width: 46vw;
            height: 46vw;
            right: -12vw;
            top: -6vh;
            background: #6e40c9;
            animation: aurora-2 32s ease-in-out infinite alternate;
        }

        @keyframes aurora-1 {
            from { transform: translate3d(0, 0, 0) scale(1); }
            to   { transform: translate3d(8vw, 7vh, 0) scale(1.18); }
        }

        @keyframes aurora-2 {
            from { transform: translate3d(0, 0, 0) scale(1.12); }
            to   { transform: translate3d(-7vw, 9vh, 0) scale(0.94); }
        }

        #waves-canvas,
        #rain-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        #waves-canvas {
            filter: blur(42px) saturate(140%);
            opacity: 0.62;
        }

        #rain-canvas { opacity: 0.55; }

        /* ---------- Cabecera compacta ---------- */
        header {
            position: relative;
            z-index: 1;
            padding: 20px 28px 22px;
            text-align: center;
            border-bottom: 2px solid rgba(0, 114, 206, 0.55);
            background: linear-gradient(180deg, rgba(13, 17, 23, 0.90) 0%, rgba(13, 17, 23, 0.55) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .main-logo {
            max-width: 100%;
            width: clamp(294px, 24vw, 420px);
            height: auto;
            display: block;
            margin: 0 auto;
            filter: drop-shadow(0 8px 22px rgba(0, 114, 206, 0.28));
        }

        .header-meta {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 10px 0 18px;
        }

        .social-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .social-icon {
            width: 32px;
            height: 32px;
            opacity: 0.85;
            transition: transform 0.25s ease, opacity 0.25s ease, filter 0.25s ease;
        }

        .social-icon:hover {
            transform: scale(1.18);
            opacity: 1;
            filter: drop-shadow(0 0 8px rgba(88, 166, 255, 0.6));
        }

        .controls-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .search-box {
            width: 100%;
            max-width: 600px;
            padding: 14px 28px;
            border-radius: 42px;
            border: 1px solid rgba(88, 166, 255, 0.20);
            background: rgba(1, 4, 9, 0.65);
            color: white;
            font-size: 21px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .search-box::placeholder { color: #6e7681; }

        .search-box:focus {
            border-color: var(--blue);
            background: rgba(1, 4, 9, 0.88);
            box-shadow: 0 0 0 3px rgba(0, 114, 206, 0.18);
        }

        .filter-container {
            display: flex;
            gap: 11px;
            justify-content: center;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-label {
            color: var(--muted);
            font-size: 15px;
            letter-spacing: 0.09em;
            text-transform: uppercase;
        }

        .btn-tool {
            background: rgba(33, 38, 45, 0.78);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 22px;
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
            font-size: 18px;
        }

        .btn-tool:hover,
        .btn-tool.active {
            background: var(--blue);
            border-color: var(--blue);
            color: #fff;
        }

        .btn-tool.active { box-shadow: 0 0 18px rgba(0, 114, 206, 0.45); }

        .btn-random.shuffling {
            background: var(--blue);
            border-color: var(--blue);
            color: #fff;
            box-shadow: 0 0 22px rgba(0, 114, 206, 0.5);
            animation: dice-roll 0.6s ease;
        }

        @keyframes dice-roll {
            0%   { transform: rotate(0deg) scale(1); }
            20%  { transform: rotate(-14deg) scale(1.06); }
            45%  { transform: rotate(12deg) scale(1.10); }
            70%  { transform: rotate(-8deg) scale(1.04); }
            100% { transform: rotate(0deg) scale(1); }
        }

        .count {
            margin: 0;
            color: var(--muted);
            font-size: 17px;
            letter-spacing: 0.02em;
        }

        /* ---------- Galería ---------- */
        main {
            position: relative;
            z-index: 1;
            padding: 36px 28px 16px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(364px, 1fr));
            gap: 30px;
            max-width: 1960px;
            margin: 0 auto;
        }

        #gallery.fade-in { animation: gallery-in 0.55s ease both; }

        @keyframes gallery-in {
            0%   { opacity: 0; transform: translateY(14px) scale(0.995); filter: blur(5px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        .card {
            background: linear-gradient(180deg, rgba(22, 27, 34, 0.97), rgba(15, 20, 27, 0.97));
            border: 1px solid rgba(88, 166, 255, 0.12);
            border-radius: 18px;
            overflow: hidden;
            color: inherit;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.22);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: rgba(0, 114, 206, 0.75);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45), 0 0 24px rgba(0, 114, 206, 0.15);
        }

        .preview-btn {
            position: relative;
            display: block;
            width: 100%;
            padding: 0;
            border: 0;
            background: #000;
            cursor: zoom-in;
            aspect-ratio: 16 / 9;
            overflow: hidden;
        }

        .preview-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.35s ease, opacity 0.35s ease;
        }

        .preview-btn:hover img {
            transform: scale(1.04);
            opacity: 0.88;
        }

        .preview-btn::after {
            content: "Ver preview";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            padding: 11px 22px;
            border-radius: 28px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
            white-space: nowrap;
        }

        .preview-btn:hover::after,
        .preview-btn:focus-visible::after {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .card-info {
            padding: 20px 21px 22px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
        }

        .card-info h3 {
            margin: 0;
            font-size: 19px;
            font-weight: 500;
            line-height: 1.4;
            height: 54px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .btn-download {
            display: inline-block;
            margin-top: auto;
            padding: 11px 25px;
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--blue);
            border-radius: 28px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-download:hover {
            background: var(--blue);
            color: #fff;
            box-shadow: 0 0 18px rgba(0, 114, 206, 0.4);
        }

        .card-info .btn-download { align-self: center; }

        .btn-container {
            position: relative;
            z-index: 1;
            text-align: center;
            margin: 42px 0 28px;
        }

        .btn-load {
            padding: 17px 50px;
            background: rgba(13, 17, 23, 0.55);
            color: var(--accent);
            border: 3px solid var(--blue);
            border-radius: 42px;
            cursor: pointer;
            font-weight: bold;
            font-size: 21px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: background 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
        }

        .btn-load:hover {
            background: var(--blue);
            color: #fff;
            box-shadow: 0 0 26px rgba(0, 114, 206, 0.45);
        }

        .hidden { display: none !important; }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--muted);
            font-size: 18px;
        }

        #debug-console {
            position: relative;
            z-index: 2;
            background: #2a1010;
            color: #ff7b72;
            padding: 10px;
            font-size: 12px;
            text-align: center;
            display: none;
        }

        /* ---------- Visor de preview ---------- */
        #preview-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 8, 12, 0.92);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 28px;
        }

        #preview-modal.open { display: flex; }

        .modal-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 95vw;
            max-height: 92vh;
        }

        #modal-img {
            max-width: 90vw;
            max-height: calc(92vh - 126px);
            border: 3px solid rgba(0, 114, 206, 0.85);
            border-radius: 14px;
            object-fit: contain;
            box-shadow: 0 0 60px rgba(0, 114, 206, 0.22);
        }

        .modal-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 22px;
            flex-wrap: wrap;
            margin-top: 17px;
            text-align: center;
        }

        #modal-title {
            margin: 0;
            font-size: 21px;
            font-weight: 500;
        }

        #modal-download { margin-top: 0; }

        .close-modal {
            position: absolute;
            top: 24px;
            right: 32px;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: white;
            font-size: 48px;
            line-height: 1;
            cursor: pointer;
            z-index: 2;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .close-modal:hover {
            background: var(--blue);
            border-color: var(--blue);
        }

        body.modal-open { overflow: hidden; }

        @media (max-width: 896px) {
            header { padding: 14px 14px 16px; }

            .main-logo { width: 250px; }

            .header-meta {
                gap: 12px;
                margin: 6px 0 12px;
            }

            .social-container { gap: 14px; }

            .social-icon {
                width: 24px;
                height: 24px;
            }

            .search-box {
                max-width: 100%;
                padding: 11px 20px;
                font-size: 17px;
            }

            .filter-container { gap: 8px; }

            .filter-label { display: none; }

            .btn-tool {
                padding: 8px 15px;
                font-size: 15px;
            }

            .controls-wrapper { gap: 10px; }

            .count { font-size: 14px; }

            main {
                padding: 24px 14px 10px;
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .card { border-radius: 16px; }

            .card-info {
                padding: 16px 17px 18px;
                gap: 14px;
            }

            .card-info h3 {
                font-size: 18px;
                height: 50px;
            }

            .btn-download {
                padding: 10px 22px;
                border-radius: 24px;
                font-size: 16px;
            }

            .preview-btn::after {
                padding: 9px 18px;
                font-size: 15px;
            }

            .btn-container { margin: 30px 0 20px; }

            .btn-load {
                padding: 14px 38px;
                font-size: 18px;
                border-width: 2px;
                border-radius: 30px;
            }

            .empty { font-size: 16px; }

            #preview-modal { padding: 14px; }

            #modal-img {
                max-height: calc(88vh - 110px);
                border-width: 2px;
                border-radius: 10px;
            }

            .modal-bar {
                gap: 10px;
                margin-top: 12px;
            }

            #modal-title { font-size: 17px; }

            #modal-download { font-size: 16px; }

            .close-modal {
                top: 10px;
                right: 14px;
                width: 46px;
                height: 46px;
                font-size: 36px;
            }

            #waves-canvas { filter: blur(28px) saturate(140%); }
            #rain-canvas { opacity: 0.45; }

            .bg-aurora {
                filter: blur(80px);
                opacity: 0.25;
            }
        }

        @media (min-width: 640px) and (max-width: 896px) {
            main { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (max-width: 380px) {
            header { padding: 12px 12px 14px; }

            .main-logo { width: 190px; }

            .header-meta {
                gap: 8px;
                margin: 4px 0 9px;
            }

            .social-container { gap: 10px; }

            .social-icon {
                width: 20px;
                height: 20px;
            }

            .search-box {
                padding: 10px 16px;
                font-size: 15px;
            }

            .filter-container { gap: 6px; }

            .btn-tool {
                padding: 6px 10px;
                font-size: 13px;
            }

            .controls-wrapper { gap: 8px; }

            .count { font-size: 13px; }

            .card-info h3 {
                font-size: 17px;
                height: 46px;
            }

            .btn-download { font-size: 15px; }

            main { padding: 20px 12px 10px; }
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .bg-aurora { animation: none; }
            #gallery.fade-in { animation: none; }
            .btn-random.shuffling { animation: none; }
        }
    </style>
</head>
<body>

<div class="bg-scene" aria-hidden="true">
    <div class="bg-aurora bg-aurora-1"></div>
    <div class="bg-aurora bg-aurora-2"></div>
    <canvas id="waves-canvas"></canvas>
    <canvas id="rain-canvas"></canvas>
</div>

<div id="debug-console"></div>

<header>
    <img src="recursos/titulo.png" alt="PS4 Themes" class="main-logo">

    <div class="header-meta">
        <div class="social-container">
            <a href="https://www.youtube.com/@kizeo0/videos" target="_blank" rel="noopener" title="YouTube">
                <img src="recursos/yt.png" alt="YouTube" class="social-icon">
            </a>
            <a href="https://github.com/kizeo404" target="_blank" rel="noopener" title="GitHub">
                <img src="recursos/git.png" alt="GitHub" class="social-icon">
            </a>
            <a href="https://x.com/KiZeo0" target="_blank" rel="noopener" title="X">
                <img src="recursos/x.png" alt="X" class="social-icon">
            </a>
        </div>
    </div>

    <div class="controls-wrapper">
        <input type="text" id="search" class="search-box" placeholder="Buscar temas...">
        <div class="filter-container" role="group" aria-label="Filtrar por tipo de tema">
            <span class="filter-label">Filtrar:</span>
            <button class="btn-tool active" data-filter="ALL" type="button" aria-pressed="true">Todos</button>
            <button class="btn-tool" data-filter="DYNAMIC" type="button" aria-pressed="false" title="Temas con Dynamic o Slide N' Go">Dinámico</button>
            <button class="btn-tool" data-filter="STATIC" type="button" aria-pressed="false" title="Temas sin animación">Estático</button>
            <button id="randomBtn" class="btn-tool btn-random" type="button" title="Ordenar los temas al azar">Azar</button>
        </div>
        <p id="count" class="count" aria-live="polite"></p>
    </div>
</header>

<div id="preview-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <span class="close-modal" id="closeModal" role="button" tabindex="0" aria-label="Cerrar">&times;</span>
    <div class="modal-content">
        <img id="modal-img" src="" alt="Vista previa">
        <div class="modal-bar">
            <h2 id="modal-title"></h2>
            <a id="modal-download" class="btn-download" href="#" target="_blank" rel="noopener">Descargar tema</a>
        </div>
    </div>
</div>

<main id="gallery"></main>

<div class="btn-container">
    <button id="loadMore" class="btn-load" type="button">Cargar más temas</button>
</div>

<script>
    let allThemes = [];
    let filteredThemes = [];
    let limit = 20;
    let typeFilter = 'ALL';
    let lastFocused = null;
    let shuffleTimer = null;

    const gallery = document.getElementById('gallery');
    const searchInput = document.getElementById('search');
    const loadMoreBtn = document.getElementById('loadMore');
    const countEl = document.getElementById('count');
    const debug = document.getElementById('debug-console');
    const randomBtn = document.getElementById('randomBtn');

    const modal = document.getElementById('preview-modal');
    const modalImg = document.getElementById('modal-img');
    const modalTitle = document.getElementById('modal-title');
    const modalDownload = document.getElementById('modal-download');
    const closeModalBtn = document.getElementById('closeModal');

    const collator = new Intl.Collator('es', { sensitivity: 'base' });

    function encodePath(path) {
        return String(path).split('/').map(encodeURIComponent).join('/');
    }

    function normalizeText(text) {
        return String(text)
            .toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '');
    }

    // Dinámico = temas con "Dynamic" o "Slide N' Go" en el nombre.
    function isDynamic(tema) {
        return /dynamic|slide/.test(normalizeText(tema.nombre));
    }

    function updateCount() {
        if (filteredThemes.length === allThemes.length) {
            countEl.textContent = `${allThemes.length} temas disponibles`;
        } else if (typeFilter === 'DYNAMIC') {
            countEl.textContent = `${filteredThemes.length} temas dinámicos`;
        } else if (typeFilter === 'STATIC') {
            countEl.textContent = `${filteredThemes.length} temas estáticos`;
        } else {
            countEl.textContent = `${filteredThemes.length} de ${allThemes.length} temas`;
        }
    }

    function makeCard(tema) {
        const card = document.createElement('article');
        card.className = 'card';

        const previewBtn = document.createElement('button');
        previewBtn.type = 'button';
        previewBtn.className = 'preview-btn';
        previewBtn.setAttribute('aria-label', `Ver preview de ${tema.nombre}`);

        const img = document.createElement('img');
        img.loading = 'eager';
        img.decoding = 'async';
        img.alt = tema.nombre;
        img.src = encodePath(tema.imagen);
        img.addEventListener('error', () => {
            // Si el WebP falla, intenta con el JPG completo.
            if (!img.dataset.fallback) {
                img.dataset.fallback = '1';
                img.src = encodePath(tema.full);
            } else {
                img.onerror = null;
                img.src = 'https://placehold.co/600x337/161b22/8b949e?text=Error';
            }
        });
        previewBtn.appendChild(img);
        previewBtn.addEventListener('click', () => openPreview(tema, previewBtn));

        const info = document.createElement('div');
        info.className = 'card-info';

        const title = document.createElement('h3');
        title.textContent = tema.nombre;

        const download = document.createElement('a');
        download.className = 'btn-download';
        download.href = tema.descarga;
        download.target = '_blank';
        download.rel = 'noopener';
        download.textContent = 'Descargar tema';

        info.append(title, download);
        card.append(previewBtn, info);
        return card;
    }

    function render() {
        gallery.innerHTML = '';
        const items = filteredThemes.slice(0, limit);

        if (items.length === 0) {
            const empty = document.createElement('p');
            empty.className = 'empty';
            empty.textContent = 'No se encontraron temas.';
            gallery.appendChild(empty);
            loadMoreBtn.classList.add('hidden');
            updateCount();
            return;
        }

        const frag = document.createDocumentFragment();
        items.forEach(tema => frag.appendChild(makeCard(tema)));
        gallery.appendChild(frag);

        loadMoreBtn.classList.toggle('hidden', limit >= filteredThemes.length);
        updateCount();
    }

    function applyFilter(shuffle = false) {
        const text = normalizeText(searchInput.value.trim());

        filteredThemes = allThemes.filter(t => {
            const matchesText = !text || normalizeText(t.nombre).includes(text);
            const matchesType = typeFilter === 'ALL'
                || (typeFilter === 'DYNAMIC' ? isDynamic(t) : !isDynamic(t));
            return matchesText && matchesType;
        });

        if (shuffle) {
            for (let i = filteredThemes.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [filteredThemes[i], filteredThemes[j]] = [filteredThemes[j], filteredThemes[i]];
            }
        } else {
            filteredThemes.sort((a, b) => collator.compare(a.nombre, b.nombre));
        }

        limit = 20;
        render();
    }

    function resetShuffleAnimation() {
        clearTimeout(shuffleTimer);
        gallery.classList.remove('fade-in');
        randomBtn.classList.remove('shuffling');
    }

    function setTypeFilter(mode) {
        resetShuffleAnimation();
        typeFilter = mode;
        document.querySelectorAll('.btn-tool[data-filter]').forEach(btn => {
            const active = btn.dataset.filter === mode;
            btn.classList.toggle('active', active);
            btn.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
        applyFilter();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function shuffleThemes() {
        resetShuffleAnimation();
        applyFilter(true);

        // Reinicia la animación aunque se pulse varias veces seguidas.
        void gallery.offsetWidth;
        gallery.classList.add('fade-in');
        randomBtn.classList.add('shuffling');

        shuffleTimer = setTimeout(() => {
            gallery.classList.remove('fade-in');
            randomBtn.classList.remove('shuffling');
        }, 650);
    }

    function openPreview(tema, trigger) {
        lastFocused = trigger || null;
        modalTitle.textContent = tema.nombre;
        modalDownload.href = tema.descarga;
        modalImg.alt = `${tema.nombre} - vista previa completa`;
        modalImg.src = encodePath(tema.full);
        modal.classList.add('open');
        document.body.classList.add('modal-open');
        closeModalBtn.focus();
    }

    function closePreview() {
        modal.classList.remove('open');
        document.body.classList.remove('modal-open');
        modalImg.removeAttribute('src');
        if (lastFocused) lastFocused.focus();
        lastFocused = null;
    }

    async function init() {
        try {
            const response = await fetch('./temas.json');
            if (!response.ok) {
                throw new Error(`Error ${response.status}: no se encontró temas.json.`);
            }

            const data = await response.json();
            if (!Array.isArray(data)) {
                throw new Error('temas.json no contiene una lista válida.');
            }

            allThemes = data;
            applyFilter();
        } catch (err) {
            debug.style.display = 'block';
            debug.textContent = 'ALERTA: ' + err.message;
            console.error(err);
        }
    }

    searchInput.addEventListener('input', () => {
        resetShuffleAnimation();
        applyFilter();
    });

    document.querySelectorAll('.btn-tool[data-filter]').forEach(btn => {
        btn.addEventListener('click', () => setTypeFilter(btn.dataset.filter));
    });

    randomBtn.addEventListener('click', shuffleThemes);

    loadMoreBtn.addEventListener('click', () => {
        limit += 20;
        render();
    });

    closeModalBtn.addEventListener('click', closePreview);
    closeModalBtn.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            closePreview();
        }
    });

    modal.addEventListener('click', (e) => {
        if (e.target === modal) closePreview();
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.classList.contains('open')) closePreview();
    });

    init();
</script>

<script>
    // Fondo decorativo: olas difuminadas + lluvia sutil.
    (function initBackground() {
        const wavesCanvas = document.getElementById('waves-canvas');
        const rainCanvas = document.getElementById('rain-canvas');
        if (!wavesCanvas || !rainCanvas) return;

        let wavesCtx;
        let rainCtx;
        try {
            wavesCtx = wavesCanvas.getContext('2d');
            rainCtx = rainCanvas.getContext('2d');
        } catch (err) {
            return;
        }
        if (!wavesCtx || !rainCtx) return;

        const reduceMotion = window.matchMedia
            ? window.matchMedia('(prefers-reduced-motion: reduce)').matches
            : false;

        let width = 0;
        let height = 0;
        let rainDrops = [];
        let lastTime = 0;

        function resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
            width = window.innerWidth;
            height = window.innerHeight;

            [wavesCanvas, rainCanvas].forEach(canvas => {
                canvas.width = Math.max(1, Math.floor(width * dpr));
                canvas.height = Math.max(1, Math.floor(height * dpr));
            });

            wavesCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
            rainCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
            createRain();
        }

        function createRain() {
            const count = Math.min(150, Math.max(30, Math.round(width / 14)));
            rainDrops = Array.from({ length: count }, () => ({
                x: Math.random() * width,
                y: Math.random() * height,
                len: 14 + Math.random() * 22,
                speed: 2.2 + Math.random() * 4.8,
                drift: 0.22 + Math.random() * 0.42,
                alpha: 0.07 + Math.random() * 0.16
            }));
        }

        function drawWaves(time) {
            wavesCtx.clearRect(0, 0, width, height);
            const t = time * 0.00016;

            const layers = [
                { base: height * 0.66, amp: 45, freq: 0.0042, speed: 1.00, phase: 0.0, top: 'rgba(0, 114, 206, 0.45)', bottom: 'rgba(0, 114, 206, 0)' },
                { base: height * 0.77, amp: 62, freq: 0.0033, speed: -0.75, phase: 2.1, top: 'rgba(77, 163, 255, 0.32)', bottom: 'rgba(77, 163, 255, 0)' },
                { base: height * 0.88, amp: 39, freq: 0.0052, speed: 1.35, phase: 4.2, top: 'rgba(110, 64, 201, 0.32)', bottom: 'rgba(110, 64, 201, 0)' }
            ];

            for (const layer of layers) {
                const gradient = wavesCtx.createLinearGradient(0, layer.base - layer.amp * 2, 0, height);
                gradient.addColorStop(0, layer.top);
                gradient.addColorStop(1, layer.bottom);

                wavesCtx.beginPath();
                wavesCtx.moveTo(0, height);
                for (let x = 0; x <= width + 12; x += 12) {
                    const y = layer.base
                        + Math.sin(x * layer.freq + t * layer.speed + layer.phase) * layer.amp
                        + Math.sin(x * layer.freq * 0.45 - t * layer.speed * 0.6 + layer.phase) * layer.amp * 0.45;
                    wavesCtx.lineTo(x, y);
                }
                wavesCtx.lineTo(width, height);
                wavesCtx.closePath();
                wavesCtx.fillStyle = gradient;
                wavesCtx.fill();
            }
        }

        function drawRain(delta) {
            rainCtx.clearRect(0, 0, width, height);
            rainCtx.lineWidth = 1.2;
            rainCtx.lineCap = 'round';
            rainCtx.strokeStyle = 'rgb(173, 216, 255)';

            for (const drop of rainDrops) {
                rainCtx.globalAlpha = drop.alpha;
                rainCtx.beginPath();
                rainCtx.moveTo(drop.x, drop.y);
                rainCtx.lineTo(drop.x - drop.drift * drop.len, drop.y + drop.len);
                rainCtx.stroke();

                drop.y += drop.speed * delta;
                drop.x -= drop.drift * drop.speed * delta * 0.6;

                if (drop.y > height + 30) {
                    drop.y = -30;
                    drop.x = Math.random() * width;
                }
                if (drop.x < -30) drop.x = width + 30;
            }
            rainCtx.globalAlpha = 1;
        }

        function frame(now) {
            const delta = lastTime ? Math.min((now - lastTime) / 16.667, 2.5) : 1;
            lastTime = now;
            drawWaves(now);
            drawRain(delta);
            requestAnimationFrame(frame);
        }

        resize();
        window.addEventListener('resize', resize);

        if (reduceMotion) {
            drawWaves(0);
            drawRain(0);
        } else {
            requestAnimationFrame(frame);
        }
    })();
</script>
